# Optional: Copy this file into GitHub -> Add file -> Create new file:
# Path: .github/workflows/e5-keepalive.yml
#
# This workflow runs every 4 hours to keep Render.com awake and trigger
# an automated Microsoft Graph API renewal cycle for your E5 Developer tenant.

name: Microsoft 365 E5 Keep-Alive & Auto-Renewal

on:
  schedule:
    # Runs every 4 hours automatically (UTC)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  keepalive:
    name: Ping Dashboard & Trigger Graph API Renewal Cycle
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Pulse
        env:
          DASHBOARD_URL: ${{ secrets.DEPLOYED_APP_URL }}
        run: |
          if [ -z "$DASHBOARD_URL" ]; then
            echo "::warning ::DEPLOYED_APP_URL secret is not set yet. Add it in GitHub Repo Settings -> Secrets."
            exit 0
          fi
          echo "Pinging E5 Renewal endpoint: ${DASHBOARD_URL}/api/keep-alive"
          curl -s -f -m 30 "${DASHBOARD_URL}/api/keep-alive" || echo "Ping failed or server waking up."
